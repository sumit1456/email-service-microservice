name: Build and Push Docker Image

on:
  push:
    branches:
      - master  # Triggers the workflow on any push to the master branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (enables modern build features and caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            sumit067hatekar/email-service:latest
            sumit067hatekar/email-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Only deploy if the build and push job is successful

    steps:
      # Step 1: SSH into AWS EC2 and deploy the container
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image we just pushed
            docker pull sumit067hatekar/email-service:latest
            
            # Stop the existing container if it is running
            docker stop email-service || true
            
            # Remove the old container
            docker rm email-service || true
            
            # Run the new container with production environment variables from GitHub Secrets
            docker run -d \
              --name email-service \
              --restart always \
              -p 8081:8081 \
              -e BREVO_API_KEY="${{ secrets.BREVO_API_KEY }}" \
              -e SENDER_EMAIL="${{ secrets.SENDER_EMAIL }}" \
              -e SENDER_NAME="${{ secrets.SENDER_NAME }}" \
              sumit067hatekar/email-service:latest

