services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    mem_limit: 100m

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    mem_limit: 300m
    env_file: ./.env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_QUEUE_RESUMEMAKER=${RABBITMQ_QUEUE_RESUMEMAKER}

  email-service:
    image: sumit067hatekar/email-service:latest
    container_name: email-service
    restart: always
    ports:
      - "8081:8081"
    mem_limit: 150m
    env_file: ./.env          # load all variables from .env
    environment:
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=${SENDER_NAME}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_QUEUE_RESUMEMAKER=${RABBITMQ_QUEUE_RESUMEMAKER}
      - RUN_SCRAPER_BACKGROUND=${RUN_SCRAPER_BACKGROUND}
      - SCRAPER_MIN_RUN_INTERVAL=${SCRAPER_MIN_RUN_INTERVAL}
      - RABBITMQ_QUEUE_JOBALERTS=${RABBITMQ_QUEUE_JOBALERTS}